services:
  db:
    image: postgres:16-alpine
    container_name: qalab-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qalab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qalab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-qalab_shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qalab} -d ${POSTGRES_DB:-qalab_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qalab-shop-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qalab}:${POSTGRES_PASSWORD:-qalab_secret}@db:5432/${POSTGRES_DB:-qalab_shop}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-replace-in-production}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret-replace-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
